services:
  ai-image-mvp:
    # 使用 GitHub Container Registry 预构建镜像
    image: ghcr.io/chengzoecharming-cyber/ai_multi_image:latest
    # 如需本地构建，可临时改为 build: .
    # build: .
    container_name: ai-image-mvp
    ports:
      - "3002:3002"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 上传的参考图（持久化，避免容器重启丢失）
      - ./public/uploads:/app/public/uploads
      # 生成的图片（持久化，避免容器重启丢失）
      - ./public/generated:/app/public/generated
      # SQLite 数据库文件持久化
      - ./prisma:/app/prisma
